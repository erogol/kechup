[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kechup"
version = "1.0.0"
description = "A project task tracker for agents, humans, and git."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Eren Gölge"}]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/erogol/kechup"
Issues = "https://github.com/erogol/kechup/issues"

[project.scripts]
kechup = "kechup.cli:main"

[tool.setuptools.packages.find]
include = ["kechup*"]
