[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kechup"
version = "1.0.0"
description = "A project task tracker for agents, humans, and git."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kechup = "kechup.cli:main"

[tool.setuptools.packages.find]
include = ["kechup*"]
